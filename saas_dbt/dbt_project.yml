name: saas_dbt
version: "1.0.0"
config-version: 2
profile: saas_dbt

model-paths: ["models"]
test-paths: ["tests"]
analysis-paths: ["analyses"]

vars:
  snapshot_date: "2025-12-31"     # "today" in the synthetic story
  calendar_end_date: "2026-06-30" # dim_date extends over the 6-month forecast horizon
  gross_margin: 0.80              # assumed SaaS gross margin used in LTV

models:
  saas_dbt:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

data_tests:
  saas_dbt:
    +severity: error
