version: 2

models:
  - name: int_account_funnel
    description: One row per account with the first timestamp of every funnel step and the number of support tickets.
    columns:
      - name: account_id
        data_tests: [unique, not_null]
  - name: int_mrr_account_month
    description: Dense account x month spine from first paid month to the snapshot month, with MRR active at month end.
    data_tests:
      - unique_combination:
          arguments:
            combination_of_columns: [account_id, month]
  - name: int_account_payments
    description: Payment health per account (failed attempts, unpaid and recovered invoices, collected revenue).
    columns:
      - name: account_id
        data_tests: [unique, not_null]
  - name: int_channel_daily
    description: Date x channel spine with visitors, signups, paid media and new paying customers.
    data_tests:
      - unique_combination:
          arguments:
            combination_of_columns: [date, channel]
