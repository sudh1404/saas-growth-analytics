version: 2

sources:
  - name: raw
    description: Raw synthetic CSVs for the fictional company CloudDesk, loaded as-is by scripts/load_raw.py.
    schema: raw
    tables:
      - name: plans
        description: Subscription plan catalogue.
      - name: accounts
        description: One row per signed-up account. Contains intentional quality issues (casing, aliases, nulls).
      - name: web_traffic
        description: Daily website visitors, sessions and pricing-page views per acquisition channel.
      - name: marketing_spend
        description: Daily paid-media spend, impressions and clicks per channel and campaign. Contains re-delivered duplicate rows.
      - name: events
        description: Product and funnel events. Contains double-fired duplicate tracking events.
      - name: subscriptions
        description: Subscription periods per account; a new row on every plan change.
      - name: invoices
        description: Monthly invoices with final collection status after dunning.
      - name: payments
        description: Individual payment attempts (initial charge + up to two retries).
      - name: usage_monthly
        description: Monthly active seats and sessions per paying account. One month has a tracking outage (null sessions).
