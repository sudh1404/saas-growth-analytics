name: CI

on:
  pull_request:
  push:
    branches: [main, "feature/**"]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Byte-compile all Python (syntax check)
        run: python -m compileall -q scripts analysis run_pipeline.py

      - name: Run the full pipeline on a small sample
        # generate -> validate -> load -> dbt build (models + ~130 tests) -> SQL -> EDA -> A/B -> churn -> forecast -> export
        run: python run_pipeline.py --small

      - name: Integration tests (pytest)
        run: python -m pytest -q

      - name: Check expected outputs exist
        run: |
          for f in data/marts/fct_mrr.parquet data/marts/churn_scores.parquet data/marts/mrr_forecast.parquet \
                   powerbi/validation_targets.csv reports/business_insights_report.md docs/data_dictionary.md; do
            test -s "$f" || { echo "missing $f"; exit 1; }
          done
          test "$(ls reports/sql_results/*.csv | wc -l)" -ge 22

      - name: Upload reports (small-sample run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-small-sample
          path: |
            reports/
            powerbi/validation_targets.csv
          retention-days: 7
